# Self-hosted production stack for a bare VPS or Coolify/Dokploy.
# Caddy terminates TLS and reverse-proxies to the app. The database is a SQLite
# file on a shared volume; MinIO is internal-only. Only Caddy is exposed.
#
#   1. cp deploy/.env.example deploy/.env   (fill in secrets + APP_DOMAIN)
#   2. docker compose -f deploy/docker-compose.selfhost.yml up -d
#
# Coolify/Dokploy: point a "Docker Compose" resource at this file and set the
# env vars in the UI instead of the .env file.

name: comfort

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    # Build from source (Coolify/Dokploy do this), or set APP_IMAGE to a
    # prebuilt image from ghcr.io and remove the `build:` block.
    image: ${APP_IMAGE:-comfort-stack:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # The SQLite file lives on the shared `dbdata` volume; MinIO is reached by
      # its internal service hostname. These override whatever .env had.
      DATABASE_URL: file:/data/app.db
      STORAGE_ENDPOINT: http://minio:9000
    volumes:
      - dbdata:/data
    depends_on:
      migrate:
        condition: service_completed_successfully

  # One-shot migration runner. Applies migrations to the SQLite file on the
  # shared volume, runs to completion on every `up`, then exits.
  migrate:
    image: ${APP_IMAGE:-comfort-stack:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["node", "dist/scripts/migrate.js"]
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/data/app.db
    volumes:
      - dbdata:/data
    restart: "no"

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
    volumes:
      - miniodata:/data

volumes:
  dbdata:
  miniodata:
  caddy_data:
  caddy_config:
