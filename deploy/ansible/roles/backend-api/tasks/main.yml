---
- name: Create app directory
  file:
    path: /opt/{{ app_name }}
    state: directory
    mode: "0755"

- name: Create SQLite data directory
  file:
    path: /opt/{{ app_name }}/data
    state: directory
    mode: "0700"

- name: Reject ephemeral container-local upload storage
  assert:
    that:
      - storage_driver | default('disabled') != 'fs'
    fail_msg: >-
      STORAGE_DRIVER=fs is not durable in this deployment because the API
      container has no persistent upload mount. Use an S3-compatible service
      such as AWS S3 or MinIO backed by persistent storage.

- name: Validate S3-compatible upload storage
  assert:
    that:
      - storage_bucket is defined
      - storage_access_key is defined
      - storage_secret_key is defined
    fail_msg: >-
      storage_bucket, storage_access_key, and storage_secret_key are required
      when storage_driver=s3.
  when: storage_driver | default('disabled') == 's3'

- name: Template env file
  template:
    src: env.j2
    dest: /opt/{{ app_name }}/.env
    mode: "0600"

- name: Pull API image (build locally and push, or use registry)
  community.docker.docker_image:
    name: "{{ api_image | default(app_name + '-api:latest') }}"
    source: pull
    force_source: true
  when: api_image is defined

# Migrate first so the SQLite file on the shared volume has its schema before
# the API container starts serving against it.
- name: Run database migrations
  community.docker.docker_container:
    name: "{{ app_name }}-migrate"
    image: "{{ api_image | default(app_name + '-api:latest') }}"
    state: started
    restart_policy: "no"
    env_file: /opt/{{ app_name }}/.env
    command: node dist/scripts/migrate.js
    volumes:
      - /opt/{{ app_name }}/data:/data
  register: migrate_result

- name: Wait for migrations to complete
  community.docker.docker_container_info:
    name: "{{ app_name }}-migrate"
  register: migrate_info
  until: migrate_info.container.State.Status != 'running'
  retries: 30
  delay: 5

- name: Run API container
  community.docker.docker_container:
    name: "{{ app_name }}-api"
    image: "{{ api_image | default(app_name + '-api:latest') }}"
    state: started
    restart_policy: unless-stopped
    env_file: /opt/{{ app_name }}/.env
    ports:
      - "{{ api_port }}:8080"
    volumes:
      - /opt/{{ app_name }}/data:/data
