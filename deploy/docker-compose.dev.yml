# Optional S3-compatible integration fixture. Ordinary local development uses
# FlyDrive's filesystem driver and does not need Docker. Run this only when
# testing the S3 path against MinIO.
#
#   docker compose -f deploy/docker-compose.dev.yml up -d
#
# Then override storage in apps/api/.env:
#   STORAGE_DRIVER=s3
#   STORAGE_ENDPOINT=http://localhost:9000  (access/secret = minioadmin)
#   STORAGE_REGION=us-east-1
#   STORAGE_ACCESS_KEY=minioadmin
#   STORAGE_SECRET_KEY=minioadmin
#   STORAGE_BUCKET=comfort-dev
#   STORAGE_FORCE_PATH_STYLE=true

name: comfort-dev

services:
  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create the dev bucket, then exit.
  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/comfort-dev;
      exit 0;
      "

volumes:
  miniodata:
