---
- name: Install nginx
  apt:
    name: nginx
    state: present
    update_cache: true

- name: Create web root
  file:
    path: /var/www/{{ app_name }}
    state: directory
    mode: "0755"
    owner: www-data
    group: www-data

- name: Sync SPA build
  synchronize:
    src: "{{ frontend_dist_local }}/app/dist/"
    dest: /var/www/{{ app_name }}/spa/
    delete: true
    rsync_opts: ["--exclude=.git"]

- name: Sync landing build
  synchronize:
    src: "{{ frontend_dist_local }}/landing/dist/"
    dest: /var/www/{{ app_name }}/landing/
    delete: true
    rsync_opts: ["--exclude=.git"]

- name: Template nginx config
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/{{ app_name }}
  notify: Reload nginx

- name: Enable site
  file:
    src: /etc/nginx/sites-available/{{ app_name }}
    dest: /etc/nginx/sites-enabled/{{ app_name }}
    state: link
  notify: Reload nginx

- name: Remove default nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Ensure nginx is running
  service:
    name: nginx
    state: started
    enabled: true
