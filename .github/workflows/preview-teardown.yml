name: Preview teardown

# Tears down a per-PR preview environment when its PR closes — merged or just
# closed. Deletes all three resources provision (preview.yml) created: the D1
# database, the R2 bucket (emptied first — R2 refuses to delete a non-empty
# bucket), and the Worker. Idempotent: a PR closed twice, or a half-done state
# left by an earlier failed run, must not error.
#
# The scheduled reaper (preview-reaper.yml) is the backstop for when this never
# runs at all; both share .github/scripts/preview-reaper.mjs so the anchored
# name guard exists in exactly one place.
#
# TRUSTED PRs ONLY, mirroring provision: fork PRs never got a preview, so there
# is nothing to tear down, and this must not run fork-authored code.

on:
  pull_request:
    types: [closed]

# Serialize against provision for the same PR: a close racing a final push must
# not delete a database mid-migration. NOT cancel-in-progress — a cancelled
# teardown could leave a bucket emptied but not deleted.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  teardown:
    name: Tear down preview environment
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      # Same secret-guard idiom as release.yml / preview.yml: no-op until every
      # credential exists, so this can merge before the secrets are configured.
      # The R2 S3 token is what empties the bucket; without it teardown cannot
      # complete synchronously, so it gates here too.
      - name: Guard on teardown configuration
        id: guard
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] \
            && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] \
            && [ -n "${{ secrets.R2_S3_ACCESS_KEY_ID }}" ] \
            && [ -n "${{ secrets.R2_S3_SECRET_ACCESS_KEY }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Preview teardown skipped — set CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, R2_S3_ACCESS_KEY_ID and R2_S3_SECRET_ACCESS_KEY to enable it."
          fi

      # Check out the BASE branch, not the PR head. For pull_request events the
      # workflow file already comes from the base branch; taking the reaping
      # script from there too means teardown runs the reviewed-and-merged guard,
      # never a version the closing PR could have rewritten. It also sidesteps
      # the missing `refs/pull/<n>/merge` a merged PR leaves behind.
      - name: Checkout base branch
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Setup pnpm
        if: steps.guard.outputs.enabled == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.guard.outputs.enabled == 'true'
        run: pnpm install

      # The R2 S3 credentials are exposed to THIS STEP ONLY (the emptying phase),
      # not job-wide. CLOUDFLARE_API_TOKEN drives the wrangler d1/r2/worker
      # deletes; the S3 keys drive `aws s3 rm`. PR_NUMBER is the sole input, and
      # the script asserts every derived name against `^buildersnetwork-pr-<n>$`
      # before any delete — so this token, though account-wide, cannot reach
      # production `buildersnetwork` / `buildersnetwork-uploads`.
      - name: Reap preview resources
        if: steps.guard.outputs.enabled == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_S3_SECRET_ACCESS_KEY }}
        run: node .github/scripts/preview-reaper.mjs teardown
