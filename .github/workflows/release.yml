name: Release

# Production deploy: on push to main, run migrations then publish the Worker
# (API + bundled SPA/landing assets) with `wrangler deploy`. Cloudflare is the
# only deploy target — the container-platform pipelines (Fly / Cloud Run / App
# Runner) were removed when deployment was narrowed to Cloudflare.

on:
  push:
    branches: [main]
  # Or gate on tags instead:
  # push:
  #   tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gate on the Cloudflare creds existing, mirroring the secret-guard idiom
      # the platform deploys used. Until both are set the job no-ops. The
      # database is a D1 binding, so there is no DATABASE_URL secret to guard on.
      - name: Guard on Cloudflare credentials
        id: guard
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] \
            && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.guard.outputs.enabled == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.guard.outputs.enabled == 'true'
        run: pnpm install

      # codegen → frontend → api → copy assets into apps/api/public so the
      # Worker serves the SPA + landing. Same build cf:deploy runs locally.
      - name: Build for Cloudflare
        if: steps.guard.outputs.enabled == 'true'
        run: pnpm build:cf

      # Workers can't run migrations themselves — apply them to the D1 database
      # before publishing the new code that depends on the migrated schema.
      # `wrangler d1 migrations apply` reads the same libs/db/migrations dir
      # (migrations_dir in wrangler.toml) and tracks state in D1's own ledger.
      - name: Run database migrations (D1)
        if: steps.guard.outputs.enabled == 'true'
        run: pnpm exec wrangler d1 migrations apply buildersnetwork --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        if: steps.guard.outputs.enabled == 'true'
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
