# Local development backing service: MinIO (S3-compatible object storage).
# The database is a local SQLite file — no container to run. Create it with
# `pnpm db:migrate && pnpm db:seed`; DATABASE_URL defaults to a `file:` URL.
#
#   docker compose -f deploy/docker-compose.dev.yml up -d
#
# Then in apps/api/.env:
#   DATABASE_URL=file:../../libs/db/local.db
#   STORAGE_ENDPOINT=http://localhost:9000  (access/secret = minioadmin)

name: comfort-dev

services:
  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create the dev bucket, then exit.
  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/comfort-dev;
      exit 0;
      "

volumes:
  miniodata:
