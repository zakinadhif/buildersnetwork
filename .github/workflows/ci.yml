name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint · Type-check · E2E
    runs-on: ubuntu-latest

    services:
      # Clean, empty Postgres for the from-scratch migration check below.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: comfort
          POSTGRES_PASSWORD: comfort
          POSTGRES_DB: comfort
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U comfort -d comfort"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      # Generate the API client before type-checking — the app imports generated hooks
      - name: Generate API client (Orval)
        run: pnpm codegen

      - name: Lint (Biome)
        run: pnpm lint

      # Static guard: every .sql file is registered in the journal (catches the
      # orphan-migration drift the runner would otherwise ignore). No DB needed.
      - name: Check migration journal integrity
        run: pnpm db:check

      # Static guard: the schema TS must not be ahead of the committed migrations.
      # `db:generate` diffs schema against the snapshots (no DB); if it emits a new
      # migration the tree goes dirty — meaning someone edited the schema without
      # running `pnpm db:generate`. No DB needed.
      - name: Check schema matches migrations
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain libs/db)" ]; then
            echo "::error::Schema changed without a migration. Run 'pnpm db:generate' and commit the result:"
            git status --porcelain libs/db
            git --no-pager diff -- libs/db
            exit 1
          fi

      # Prove the generated migrations apply cleanly from an empty database —
      # validates SQL/ordering/FKs that db:push never exercises locally.
      - name: Verify migrations apply on a clean database
        run: pnpm db:migrate
        env:
          # 127.0.0.1, not localhost: on the runner `localhost` can resolve to
          # IPv6 (::1) first, but the Postgres service only publishes on IPv4 —
          # postgres-js then hits ECONNREFUSED. Forcing IPv4 avoids that.
          DATABASE_URL: postgres://comfort:comfort@127.0.0.1:5432/comfort

      - name: Unit tests — api
        run: pnpm test:api

      - name: Type-check — api
        working-directory: apps/api
        run: pnpm exec tsc --noEmit

      - name: Type-check — app
        working-directory: apps/app
        run: pnpm exec tsc -b

      - name: Type-check — mockups
        working-directory: apps/mockups
        run: pnpm exec tsc -b

      - name: Install Playwright browsers
        working-directory: apps/app
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e
