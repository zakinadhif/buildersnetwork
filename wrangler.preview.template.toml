# Per-PR preview environment config — TEMPLATE.
#
# Rendered to `wrangler.preview.toml` by .github/workflows/preview.yml, which
# substitutes the double-underscore placeholder tokens below. The rendered file
# is gitignored: it carries a live database_id and the preview auth secret.
#
# This is a SEPARATE FILE, not an `[env.preview]` block in wrangler.toml, and
# that distinction is load-bearing. Per the wrangler config docs, bindings
# (d1_databases, r2_buckets, send_email, vars) are NON-inheritable, but `routes`
# IS inheritable. A preview deployed against the top-level wrangler.toml would
# therefore inherit `{ pattern = "buildersnetwork.web.id", custom_domain = true }`
# and try to attach itself to the production apex domain. An env block cannot
# drop an inheritable key by omission; a file with no `routes` key at all can.
#
# So: no `routes` here, ever. Preview Workers live only on *.workers.dev.
#
# Every wrangler command that touches this preview's D1 database must pass
# `--config wrangler.preview.toml`. `wrangler d1 migrations apply <name>` does
# NOT resolve the database from the name argument — it reads the
# [[d1_databases]] entry from the config file in play and uses that entry's
# database_id. Without --config it picks up wrangler.toml, i.e. PRODUCTION.

name = "buildersnetwork-pr-__PR_NUMBER__"
main = "apps/api/src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Explicit, though it is also the default in the absence of `routes`.
workers_dev = true

# Serves the SPA + landing built by `pnpm build:cf` into apps/api/public/.
# Deploying without that build yields a Worker with empty or stale assets.
#
# `run_worker_first` for `/app/*` is required for deep links to work — see the
# comment in wrangler.toml. `/app/assets/*` (hashed Vite bundle) is excluded so
# it still serves straight from the edge.
[assets]
directory = "apps/api/public"
binding = "ASSETS"
run_worker_first = ["/app/*", "!/app/assets/*"]

[ai]
binding = "AI"

# Per-PR D1 database, created by the workflow. `database_id` is read back via
# `wrangler d1 info <name> --json` — `d1 create` prints a TOML snippet for
# humans and has no --json.
[[d1_databases]]
binding = "DB"
database_name = "buildersnetwork-pr-__PR_NUMBER__"
database_id = "__DATABASE_ID__"
migrations_dir = "libs/db/migrations"

# Per-PR R2 bucket. Storage is the one binding that is duplicated rather than
# omitted: omitting UPLOADS does not isolate a side effect, it turns the cover
# upload feature off (the routes 503), so a PR touching uploads could not be
# reviewed in its own preview. The invariant that matters: this must never name
# the production bucket `buildersnetwork-uploads`.
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "buildersnetwork-pr-__PR_NUMBER__-uploads"

# Deliberately absent, and absence is the isolation mechanism:
#
#   [[send_email]]      — no email binding
#   RESEND_API_KEY      — the real prod email path; unset => createNoopEmail()
#   GOOGLE_CLIENT_ID    — unset => better-auth registers no socialProviders
#   GOOGLE_CLIENT_SECRET
#   ADMIN_EMAILS        — no admin surface in preview
#
# None of these are inheritable, so they stay absent without further effort.

[vars]
AI_WORKERS_MODEL = "@cf/zai-org/glm-4.7-flash"
# Literal, non-secret preview feature settings live in this tracked template.
# CI copies them unchanged into the ephemeral wrangler.preview.toml; edit these
# values in a PR to change its next preview deployment.
FEATURE_FLAG_PROVIDER = "env"
FEATURE_AI_ASSISTANT = "true"
EMAIL_FROM = "Al-Fath Berkarya (preview) <noreply@buildersnetwork.web.id>"
# Drives BETTER_AUTH_URL and ALLOWED_ORIGINS in worker.ts, so it must be correct
# on the FIRST deploy — hence assembled from the CLOUDFLARE_WORKERS_SUBDOMAIN
# repo variable rather than parsed out of deploy output.
APP_URL = "__APP_URL__"
# Freshly generated by the workflow on every run, never a stored secret and
# never production's. A var rather than a `wrangler secret put` because secrets
# require the Worker to already exist, forcing deploy -> secret -> redeploy and
# invalidating any cookie signed in between. Per-run generation is what makes it
# safe to carry in plaintext here: wrangler's deploy banner leaks a truncated
# prefix into the public Actions log, so the value must be a single-deploy
# throwaway. Cookies don't survive a push anyway (`--reset` empties `users`,
# sessions cascade), so nothing is lost by rotating it every run.
BETTER_AUTH_SECRET = "__BETTER_AUTH_SECRET__"
