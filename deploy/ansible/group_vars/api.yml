api_image: "ooflamp/buildersnetwork-api:latest"
# gemini_api_key and better_auth_secret are secrets — store in ansible-vault:
#   ansible-vault encrypt_string 'AIza...' --name gemini_api_key
# gemini_api_key: !vault |
#   $ANSIBLE_VAULT;1.1;AES256
#   ...
# better_auth_secret: !vault | ...
# The database is a SQLite file inside the app's data dir on this host, mounted
# into the API and migrate containers at /data (see the backend-api role).
database_url: "file:/data/app.db"
serve_static: "false"

# Uploads are disabled until durable object storage is configured. Do not use
# `fs`: the API container has no persistent upload mount. For AWS S3, set these
# values and keep storage_endpoint undefined. For MinIO, also set its reachable
# private URL and force path-style requests; put credentials in Ansible Vault.
# storage_driver: "s3"
# storage_bucket: "buildersnetwork-uploads"
# storage_region: "ap-southeast-1"
# storage_endpoint: "http://<MINIO_PRIVATE_IP>:9000"
# storage_force_path_style: "true"
