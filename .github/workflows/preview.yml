name: Preview

# Provisions an ephemeral per-PR preview environment: a D1 database, an R2
# bucket, and a Worker on *.workers.dev, all named `buildersnetwork-pr-<n>`.
# Teardown is a separate workflow (#45); until it lands, previews are cleaned up
# by hand and the bucket lifecycle rule below keeps objects from accumulating
# forever.
#
# This supersedes the preview.yml deleted in 15cdbb2, which bound the preview
# Worker to PRODUCTION bindings (including the prod DATABASE_URL) and whose
# login was broken on the *.workers.dev origin. Both faults are addressed here:
# every binding is per-PR, and APP_URL is set to the preview's own URL so
# better-auth derives a matching baseURL.
#
# TRUSTED PRs ONLY. Fork PRs skip this entirely and keep the static mockup
# preview (preview-mockups*.yml) plus CI. The `workflow_run` split that makes
# those safe does not rescue this case: an app preview's deploy half must apply
# migrations, and the migrations come from the PR, so there is no way to build
# it without executing PR-authored code holding database credentials.

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Serialize per PR. NOT cancel-in-progress: a cancelled run could interrupt
# `d1 migrations apply` partway through the ledger.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

env:
  PROD_DATABASE_NAME: buildersnetwork
  PROD_BUCKET_NAME: buildersnetwork-uploads
  # Max concurrent preview environments. Sits BELOW D1's free-tier cap of 10
  # (prod takes 1 → 9 available) with 2 slots of headroom, so provision never
  # meets a raw "too many databases" D1 error mid-run. A knob: raise if preview
  # concurrency genuinely runs tight, lower to be safer. See issue #45.
  PREVIEW_CAP: 7

jobs:
  provision:
    name: Provision preview environment
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      # Same secret-guard idiom as release.yml / preview-mockups-deploy.yml: the
      # workflow no-ops until every input exists, so it can merge before the
      # Cloudflare credentials and preview secret are configured.
      - name: Guard on preview configuration
        id: guard
        env:
          SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] \
            && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] \
            && [ -n "$SUBDOMAIN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Preview provisioning skipped — set CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and the CLOUDFLARE_WORKERS_SUBDOMAIN repo variable to enable it."
          fi

      - name: Checkout
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: steps.guard.outputs.enabled == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.guard.outputs.enabled == 'true'
        run: pnpm install

      # Every downstream name derives from the PR number, and every one of them
      # is asserted against the anchored preview pattern before it reaches a
      # wrangler command that can destroy something.
      - name: Compute preview identifiers
        id: names
        if: steps.guard.outputs.enabled == 'true'
        env:
          PR: ${{ github.event.pull_request.number }}
          SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
        run: |
          set -euo pipefail
          case "$PR" in
            ''|*[!0-9]*) echo "::error::PR number is not numeric: '$PR'"; exit 1 ;;
          esac
          worker="buildersnetwork-pr-${PR}"
          bucket="buildersnetwork-pr-${PR}-uploads"
          app_url="https://${worker}.${SUBDOMAIN}.workers.dev"

          # Belt and braces: these names must never collide with production.
          [ "$worker" != "$PROD_DATABASE_NAME" ] || { echo "::error::refusing to target production database"; exit 1; }
          [ "$bucket" != "$PROD_BUCKET_NAME" ]   || { echo "::error::refusing to target production bucket"; exit 1; }

          {
            echo "worker=$worker"
            echo "database=$worker"
            echo "bucket=$bucket"
            echo "app_url=$app_url"
          } >> "$GITHUB_OUTPUT"

      # Cap concurrent previews below D1's hard limit. Counted LIVE from the
      # databases that actually exist right now, never a stored counter — so
      # every re-run self-corrects: close a preview elsewhere and re-run here,
      # and the freed slot is seen immediately with no state to reconcile.
      #
      # A PR that ALREADY has a preview database is never blocked — otherwise a
      # push to an existing preview would start failing the moment the account
      # fills. The cap only gates NEW environments.
      - name: Check preview capacity
        id: cap
        if: steps.guard.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DB_NAME: ${{ steps.names.outputs.database }}
        run: |
          set -euo pipefail
          json="$(pnpm exec wrangler d1 list --json)"
          norm='(if type == "array" then . else (.result // []) end)'
          count="$(printf '%s' "$json" | jq "[ ${norm}[] | select(.name | test(\"^buildersnetwork-pr-[0-9]+$\")) ] | length")"
          exists="$(printf '%s' "$json" | jq --arg n "$DB_NAME" "[ ${norm}[] | select(.name == \$n) ] | length")"

          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "cap=$PREVIEW_CAP" >> "$GITHUB_OUTPUT"

          if [ "$exists" -gt 0 ]; then
            echo "This PR already has a preview database ($count/$PREVIEW_CAP used) — provisioning continues."
            echo "proceed=true"  >> "$GITHUB_OUTPUT"
            echo "capped=false"  >> "$GITHUB_OUTPUT"
          elif [ "$count" -ge "$PREVIEW_CAP" ]; then
            echo "::notice::Preview capacity reached ($count/$PREVIEW_CAP) — skipping provision for this PR."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "capped=true"   >> "$GITHUB_OUTPUT"
          else
            echo "Capacity available ($count/$PREVIEW_CAP used) — provisioning a new preview."
            echo "proceed=true"  >> "$GITHUB_OUTPUT"
            echo "capped=false"  >> "$GITHUB_OUTPUT"
          fi

      # Sticky, actionable feedback. When full, tell the reviewer HOW to get a
      # preview (free a slot, then push/re-run) — not just that it's full. When
      # capacity is available, clear any earlier rejection so a now-succeeding
      # PR doesn't keep showing a stale "full" notice.
      - name: Comment on preview capacity
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/github-script@v7
        env:
          CAPPED: ${{ steps.cap.outputs.capped }}
          COUNT: ${{ steps.cap.outputs.count }}
          CAP: ${{ steps.cap.outputs.cap }}
        with:
          script: |
            const marker = "<!-- preview-cap -->";
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number },
            );
            const existing = comments.find((c) => (c.body || "").includes(marker));

            if (process.env.CAPPED !== "true") {
              if (existing) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
              }
              return;
            }

            const { COUNT, CAP } = process.env;
            const body = [
              marker,
              "### ⛔ Preview penuh",
              "",
              `Semua **${COUNT}/${CAP}** slot preview lagi kepakai, jadi PR ini belum dapat app preview sendiri.`,
              "",
              `D1 membatasi akun ini di 10 database (free tier); preview ditahan di ${CAP} biar ada headroom. Buat dapat preview di sini:`,
              "",
              "1. Tutup salah satu PR preview yang sudah nggak dipakai — environment-nya dibongkar saat ditutup, dan slotnya kebuka, lalu",
              "2. **push commit baru** ke PR ini (atau re-run workflow **Preview**).",
              "",
              "_\"Re-run jobs\" mengulang commit lama; push commit baru adalah retrigger yang paling andal._",
            ].join("\n");

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      # Idempotent: a second push to the same PR reuses the existing database.
      - name: Create per-PR D1 database
        if: steps.guard.outputs.enabled == 'true' && steps.cap.outputs.proceed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DB_NAME: ${{ steps.names.outputs.database }}
        run: |
          set -euo pipefail
          # Tolerate both shapes wrangler has used for --json: a bare array, or
          # an object wrapping one under `result`.
          if pnpm exec wrangler d1 list --json \
            | jq -e --arg n "$DB_NAME" \
                '(if type == "array" then . else (.result // []) end)[] | select(.name == $n)' >/dev/null; then
            echo "D1 database $DB_NAME already exists — reusing it."
          else
            pnpm exec wrangler d1 create "$DB_NAME"
          fi

      # `d1 create` prints a TOML snippet for humans and has no --json, so read
      # the id back from the account listing. The field name is the one thing
      # here that would silently bind the preview to the WRONG database, so
      # accept either spelling and fail loudly when neither is present.
      - name: Resolve database_id
        id: db
        if: steps.guard.outputs.enabled == 'true' && steps.cap.outputs.proceed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DB_NAME: ${{ steps.names.outputs.database }}
        run: |
          set -euo pipefail
          db_id="$(pnpm exec wrangler d1 list --json \
            | jq -r --arg n "$DB_NAME" \
                '(if type == "array" then . else (.result // []) end)[]
                 | select(.name == $n)
                 | (.uuid // .database_id) // empty')"

          if [ -z "$db_id" ] || [ "$db_id" = "null" ]; then
            echo "::error::could not resolve a database_id for $DB_NAME from 'wrangler d1 list --json'"
            exit 1
          fi

          prod_id="$(grep -oE '^database_id = "[^"]+"' wrangler.toml | head -n1 | cut -d'"' -f2 || true)"
          if [ -n "$prod_id" ] && [ "$db_id" = "$prod_id" ]; then
            echo "::error::resolved database_id equals the production database_id — aborting"
            exit 1
          fi

          echo "::add-mask::$db_id"
          echo "id=$db_id" >> "$GITHUB_OUTPUT"

      # The rendered config is what makes `--config` meaningful downstream.
      # Rendered with node rather than sed/envsubst so the auth secret is
      # substituted literally and TOML-escaped, whatever characters it holds.
      - name: Render wrangler.preview.toml
        if: steps.guard.outputs.enabled == 'true' && steps.cap.outputs.proceed == 'true'
        env:
          PR: ${{ github.event.pull_request.number }}
          DATABASE_ID: ${{ steps.db.outputs.id }}
          APP_URL: ${{ steps.names.outputs.app_url }}
        run: |
          set -euo pipefail
          # Freshly generated per run, NOT a stored GitHub secret. A shared,
          # permanent value would sign cookies for every preview of every PR
          # forever — one long-lived thing nothing rotates, and one a human could
          # someday set equal to production's. It also can't be kept out of the
          # public Actions log: `wrangler deploy` prints its bindings banner with
          # the value truncated to a prefix, and GitHub masks only exact-substring
          # matches, so the prefix leaks past the mask. Regenerating per run makes
          # whatever leaks a single-deploy throwaway. Cookies don't survive a push
          # regardless — `--reset` empties `users` and sessions cascade on delete.
          BETTER_AUTH_SECRET="$(openssl rand -base64 32)"
          export BETTER_AUTH_SECRET
          # Masks whole-value occurrences (e.g. the render check below). Does NOT
          # cover wrangler's truncated-prefix banner — see above; that leak is now
          # harmless because the value is per-run.
          echo "::add-mask::$BETTER_AUTH_SECRET"
          node -e '
            const fs = require("node:fs");
            const tpl = fs.readFileSync("wrangler.preview.template.toml", "utf8");
            const subs = {
              __PR_NUMBER__: process.env.PR,
              __DATABASE_ID__: process.env.DATABASE_ID,
              __APP_URL__: process.env.APP_URL,
              // JSON string syntax is a subset of TOML basic-string syntax.
              __BETTER_AUTH_SECRET__: JSON.stringify(process.env.BETTER_AUTH_SECRET).slice(1, -1),
            };
            let out = tpl;
            for (const [token, value] of Object.entries(subs)) {
              if (!value) throw new Error(`missing substitution for ${token}`);
              out = out.split(token).join(value);
            }
            if (out.includes("__")) throw new Error("unsubstituted placeholder remains");
            fs.writeFileSync("wrangler.preview.toml", out);
          '

      # The single most expensive failure this workflow can have is a preview
      # command reaching production. Assert the rendered config cannot.
      - name: Assert preview config is isolated from production
        if: steps.guard.outputs.enabled == 'true' && steps.cap.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          cfg=wrangler.preview.toml

          # `routes` is INHERITABLE. Its presence here would attach the preview
          # Worker to the production apex domain.
          if grep -qE '^[[:space:]]*routes?[[:space:]]*=' "$cfg"; then
            echo "::error::preview config declares 'routes' — it would claim the production custom domain"
            exit 1
          fi

          grep -qE "^database_name = \"buildersnetwork-pr-[0-9]+\"$" "$cfg" \
            || { echo "::error::preview database_name is not an anchored per-PR name"; exit 1; }
          grep -qE "^bucket_name = \"buildersnetwork-pr-[0-9]+-uploads\"$" "$cfg" \
            || { echo "::error::preview bucket_name is not an anchored per-PR name"; exit 1; }

          if grep -q "\"$PROD_BUCKET_NAME\"" "$cfg"; then
            echo "::error::preview config names the production bucket"
            exit 1
          fi

          # Side-effect isolation is by omission; prove the omissions hold.
          for forbidden in 'send_email' 'RESEND_API_KEY' 'GOOGLE_CLIENT_ID' 'GOOGLE_CLIENT_SECRET'; do
            if grep -qE "^[[:space:]]*\[?\[?${forbidden}" "$cfg"; then
              echo "::error::preview config sets '$forbidden' — email/OAuth must stay absent"
              exit 1
            fi
          done
          echo "Preview config is isolated."

      # Idempotent, and deliberately NON-destructive: an existing bucket is left
      # exactly as it is. Reviewers' uploads from earlier pushes must survive.
      - name: Create per-PR R2 bucket
        id: bucket
        if: steps.guard.outputs.enabled == 'true' && steps.cap.outputs.proceed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET: ${{ steps.names.outputs.bucket }}
        run: |
          set -euo pipefail
          if out="$(pnpm exec wrangler r2 bucket create "$BUCKET" 2>&1)"; then
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "Created R2 bucket $BUCKET."
          elif printf '%s' "$out" | grep -qiE 'already (exists|owned)|10004'; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "R2 bucket $BUCKET already exists — reusing it, contents untouched."
          else
            printf '%s\n' "$out"
            echo "::error::failed to create R2 bucket $BUCKET"
            exit 1
          fi

      # Defense in depth, not the teardown mechanism (#45 owns that): if teardown
      # never runs, objects expire on their own and the bucket becomes deletable
      # — R2 refuses to delete a non-empty bucket.
      - name: Set bucket lifecycle expiry
        if: steps.guard.outputs.enabled == 'true' && steps.cap.outputs.proceed == 'true' && steps.bucket.outputs.created == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET: ${{ steps.names.outputs.bucket }}
        run: |
          set -euo pipefail
          pnpm exec wrangler r2 bucket lifecycle add "$BUCKET" \
            --name preview-expiry \
            --expire-days 7 \
            --force

      # The production migration path, verbatim — same command, same D1 ledger,
      # so a push that changes no migrations is a no-op.
      #
      # --config IS NOT OPTIONAL. `wrangler d1 migrations apply <name>` does not
      # resolve the database from the name argument: it reads the
      # [[d1_databases]] entry out of the config file in play and uses THAT
      # entry's database_id. Proven in production on 2026-07-09/10, where
      # `migrations apply buildersnetwork --remote` sent its query to the
      # placeholder id from wrangler.toml. Drop --config here and PR-authored
      # migrations run against the PRODUCTION database.
      - name: Apply migrations to preview D1
        if: steps.guard.outputs.enabled == 'true' && steps.cap.outputs.proceed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DB_NAME: ${{ steps.names.outputs.database }}
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 migrations apply "$DB_NAME" \
            --remote --config wrangler.preview.toml

      # The seeder runs straight against the preview D1 over its HTTP API — see
      # createD1HttpDb in libs/db. D1_DATABASE_ID is what selects that driver;
      # without it the CLI would fall back to libSQL and read DATABASE_URL.
      #
      # Reset-then-seed, not INSERT OR IGNORE: a preview must show the seed data
      # of the commit under review, not a stale first-push snapshot. Its one cost
      # is known and accepted — seeded karya rows return to coverKey = NULL, so a
      # cover a reviewer uploaded on an earlier push is orphaned in the bucket
      # (harmless; teardown reaps it). The bucket itself is never emptied.
      #
      # `--reset` empties only the tables each seeder DECLARES, so a new table
      # belongs in its seeder's `tables` — there is nothing to update here.
      #
      # NODE_ENV must be set: the seed runner refuses to run under "production"
      # without --force, and that is the default when it is unset.
      - name: Seed preview D1
        if: steps.guard.outputs.enabled == 'true' && steps.cap.outputs.proceed == 'true'
        env:
          NODE_ENV: development
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ steps.db.outputs.id }}
        run: pnpm db:seed -- --reset --yes

      # Fills apps/api/public/ with the built SPA + landing, which the [assets]
      # binding serves. Deploying without this yields empty or stale assets.
      # The frontend needs no per-PR configuration: auth-client.ts falls back to
      # window.location.origin.
      - name: Build for Cloudflare
        if: steps.guard.outputs.enabled == 'true' && steps.cap.outputs.proceed == 'true'
        run: pnpm build:cf

      - name: Deploy preview Worker
        if: steps.guard.outputs.enabled == 'true' && steps.cap.outputs.proceed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER: ${{ steps.names.outputs.worker }}
        run: |
          set -euo pipefail
          pnpm exec wrangler deploy --name "$WORKER" --config wrangler.preview.toml

      - name: Comment preview URL
        if: steps.guard.outputs.enabled == 'true' && steps.cap.outputs.proceed == 'true'
        uses: actions/github-script@v7
        env:
          APP_URL: ${{ steps.names.outputs.app_url }}
          WORKER: ${{ steps.names.outputs.worker }}
        with:
          script: |
            const url = process.env.APP_URL;
            const worker = process.env.WORKER;
            const sha = context.payload.pull_request.head.sha;
            const marker = "<!-- preview-app -->";
            const body = [
              marker,
              "### 🚀 App preview",
              "",
              `**${url}**`,
              "",
              "Sign in with any seeded account — password `seedpassword123`:",
              "",
              "`hafiz@seed.local` · `fatimah@seed.local` · `rizal@seed.local` · `dinda@seed.local` · `arya@seed.local`",
              "",
              `_Own D1 database (\`${worker}\`) and R2 bucket (\`${worker}-uploads\`), seed data only. Email and Google sign-in are disabled; seed data is reset on every push._`,
              "",
              `<sub>Commit ${sha.slice(0, 7)} · updated ${new Date().toISOString()}</sub>`,
            ].join("\n");

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number },
            );
            const existing = comments.find((c) => (c.body || "").includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }
