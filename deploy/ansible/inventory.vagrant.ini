# Vagrant local 2-tier deployment (web + api; the database is a SQLite file on
# the api host).
# SSH keys must be copied from .vagrant/machines/*/virtualbox/private_key
# to WSL's native filesystem first — see deploy/docs/DEPLOY_VAGRANT.md step 3.

[web]
frontend ansible_host=192.168.56.10 ansible_user=vagrant ansible_ssh_private_key_file=~/.ssh/vagrant-bn/frontend.key

[api]
backend  ansible_host=192.168.56.11 ansible_user=vagrant ansible_ssh_private_key_file=~/.ssh/vagrant-bn/api.key

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
