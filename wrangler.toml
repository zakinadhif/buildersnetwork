# Cloudflare Workers deployment configuration.
# Run `pnpm build:cf` first to populate apps/api/public/ with built assets,
# then deploy with `wrangler deploy`.
#
# Secrets (never commit these) — set via:
#   wrangler secret put BETTER_AUTH_SECRET
#   wrangler secret put ANTHROPIC_API_KEY   # not needed when AI_PROVIDER=workers-ai
#   wrangler secret put RESEND_API_KEY      # the LIVE email sender (Resend, free
#                                           # tier). Takes precedence over the
#                                           # [[send_email]] binding below, which is
#                                           # dormant on this free-tier account.
#
# The database is a D1 binding, not a connection string — there is no
# DATABASE_URL secret in the Worker.

name = "buildersnetwork"
main = "apps/api/src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Custom domain — binds the Worker to the apex of the buildersnetwork.web.id
# zone (which must be active in this Cloudflare account). On deploy, wrangler
# provisions the DNS record + edge certificate. The workers.dev subdomain stays
# enabled alongside this, so `versions upload` preview URLs keep working.
routes = [
  { pattern = "buildersnetwork.web.id", custom_domain = true },
]

# Workers Assets — serves the built SPA and landing from apps/api/public/.
#
# `run_worker_first` is NOT optional for `/app/*`. Without it, Cloudflare's
# asset router handles a request BEFORE the Worker ever runs, and for any
# extensionless path that isn't a literal file (i.e. every client-side SPA
# route — /app/minat, /app/karya/:id, ...) its default behavior is a
# `307 -> /app/` redirect, not a fallthrough to the Worker. That silently
# broke every deep link into the app (confirmed in prod via curl on
# 2026-07-11) despite the SPA-fallback code in apps/api/src/worker.ts
# appearing to handle it — the code was simply never reached. `/app/assets/*`
# (the hashed Vite bundle) is excluded so those still serve straight from
# the edge with no Worker hop.
[assets]
directory = "apps/api/public"
binding = "ASSETS"
run_worker_first = ["/app/*", "!/app/assets/*"]

# Workers AI — free daily quota for inference.
[ai]
binding = "AI"

# D1 — the SQLite database. Create it once before deploying:
#   wrangler d1 create buildersnetwork
# then paste the returned database_id below. Apply migrations with:
#   wrangler d1 migrations apply buildersnetwork --remote
[[d1_databases]]
binding = "DB"
database_name = "buildersnetwork"
database_id = "1a06c788-e588-4420-b9ed-e7cab1bda2de"
migrations_dir = "libs/db/migrations"

# R2 bucket for uploads (karya cover images, issue #18). Create the bucket once
# before deploying:  wrangler r2 bucket create buildersnetwork-uploads
# Absent binding → the cover upload/serve routes return 503 (feature dark).
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "buildersnetwork-uploads"

# Cloudflare Email Service (beta). Requires the Workers Paid plan — this account
# is on the free tier, so this binding is currently DORMANT: transactional email
# is actually sent through Resend (set the RESEND_API_KEY secret). Kept here for
# when the account moves to Paid. At runtime Resend wins whenever RESEND_API_KEY
# is set; this binding is only reached if that key is absent. Sender domain is
# configured via Cloudflare Email Routing.
[[send_email]]
name = "EMAIL"

# Non-secret vars. Secrets go via `wrangler secret put`.
[vars]
AI_WORKERS_MODEL = "@cf/meta/llama-4-scout-17b-16e-instruct"
# Canonical production URL — drives auth redirects and email links. Points at
# the custom domain now that the Worker is bound to it.
APP_URL = "https://buildersnetwork.web.id"
# Sender address for outgoing email. Its domain must be verified with the active
# email provider (Cloudflare Email Routing, or Resend when RESEND_API_KEY is set).
EMAIL_FROM = "Al-Fath Berkarya <noreply@buildersnetwork.web.id>"

# --- Per-environment overrides ---

[env.production.vars]
# APP_URL = "https://yourapp.example.com"
