openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Al-Fath Berkarya API
servers:
  - url: /api
    description: Same-origin (production / single-container)
  - url: http://localhost:3000/api
    description: Local dev API server
tags:
  - name: ai
    description: AI completion
  - name: health
    description: Health check

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /ai/stream:
    post:
      operationId: aiStream
      tags: [ai]
      summary: Stream a chat completion
      description: >
        Returns a `text/plain` chunked response. Consume with the `useStream`
        hook from `@myapp/ai/react` — not the generated client function.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteRequest"
      responses:
        "200":
          description: Streamed plain-text chunks
          content:
            text/plain:
              schema:
                type: string
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ai/complete:
    post:
      operationId: aiComplete
      tags: [ai]
      summary: Complete a chat conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteRequest"
      responses:
        "200":
          description: AI response text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: AI provider not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        ok:
          type: boolean
        version:
          type: string
      required: [ok, version]

    Message:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
      required: [role, content]

    CompleteRequest:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
          minItems: 1
      required: [messages]

    CompleteResponse:
      type: object
      properties:
        text:
          type: string
      required: [text]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
