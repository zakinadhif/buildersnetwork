name: Mockup preview

# BUILD half of the isolated mockup preview (deploy half: preview-mockups-deploy.yml).
#
# This runs on `pull_request`, so for PRs from forks it gets a read-only token
# and NO repo secrets — GitHub's protection against untrusted PRs stealing
# credentials. That's exactly why the build is split out: this job runs the
# (potentially untrusted) PR code to produce the static gallery, but has no
# secret to leak. The privileged Cloudflare deploy happens in the separate
# workflow_run workflow, which never executes PR code.
#
# Only static output is produced here — the mockup gallery is its own app
# (`apps/mockups`) with no API/DB dependency, so nothing sensitive is in scope.

on:
  pull_request:
    branches: [main]
    # Any PR that touches the gallery gets a preview — the path is the real
    # signal now that mockups are their own app (replaces the old mockup/* and
    # design/* branch-name convention, which only ever proxied for this).
    # Includes the workflow itself so edits to it get a test build.
    paths:
      - "apps/mockups/**"
      - ".github/workflows/preview-mockups.yml"

# One build per PR; a new push supersedes the in-flight run.
concurrency:
  group: preview-mockups-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build mockup gallery
    runs-on: ubuntu-latest
    # No secrets are used in this job; the default read-only token is enough.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      # Static build of the standalone gallery → apps/mockups/dist (base "/",
      # index.html at the root). No codegen, landing, api, or DB.
      - name: Build mockups
        run: pnpm --filter mockups run build

      # Stage the built site plus the PR coordinates the deploy workflow needs
      # (workflow_run doesn't receive PR context directly, so we ferry it in the
      # artifact). Contents: site/** + pr-meta.json.
      - name: Stage artifact
        run: |
          mkdir -p artifact/site
          cp -r apps/mockups/dist/. artifact/site/
          cat > artifact/pr-meta.json <<EOF
          {
            "pr": "${{ github.event.pull_request.number }}",
            "head_ref": "${{ github.event.pull_request.head.ref }}",
            "sha": "${{ github.event.pull_request.head.sha }}"
          }
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mockups-preview
          path: artifact
          retention-days: 3
